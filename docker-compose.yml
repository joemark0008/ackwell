# Dev deployment (Coolify custom service "ackwell"): live hot reload.
# The project folder is bind-mounted, so saving a file on the server updates the live site.
# One container runs `turbo dev`: schemas (tsup --watch) + api (nest --watch, :3000) + web (vite, :5173).
# Vite proxies /api and /health to the API inside the same container.
# Secrets (DATABASE_URL, BETTER_AUTH_SECRET, SEED_ADMIN_PASSWORD) are Coolify env vars, never committed.
# DB = Coolify standalone Postgres "ackwell-db" on the "coolify" network
# (enable "Connect to Predefined Network" on this service).
#
# MLLP (raw TCP, cannot go through Traefik/Cloudflare): the range 6100-6150 is published on the
# machine's LAN IP only. This host-port mapping is an exception to /root/project/CLAUDE.md §2,
# approved by the user on 2026-11-11 for this project. (6000-6050 clashes with Coolify's own 6001-6002.)
# HL7 senders connect to 172.16.10.30:<channel port>.
services:
  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - PORT=3000
      - APP_URL=https://ackwell.joemarkgimeno.com
      - PUBLIC_HOST=ackwell.joemarkgimeno.com
      - API_PROXY_TARGET=http://localhost:3000
      - MLLP_PORT_RANGE=6100-6150
      - MLLP_ADVERTISED_HOST=${MLLP_BIND_IP:-172.16.10.30}
      - RETENTION_DEFAULT_DAYS=7
      - LOG_LEVEL=info
      - TURBO_TELEMETRY_DISABLED=1
      - NPM_CONFIG_UPDATE_NOTIFIER=false
    volumes:
      - /root/project/ackwell:/app
      - ackwell-node-modules:/app/node_modules
    expose:
      - "5173"
      - "3000"
    ports:
      - "${MLLP_BIND_IP:-172.16.10.30}:6100-6150:6100-6150"
    restart: unless-stopped

volumes:
  ackwell-node-modules:
