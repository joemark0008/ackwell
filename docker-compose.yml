# Development with live hot reload in one container (no Node needed on the host).
# One container runs `turbo dev`: schemas (tsup --watch) + api (nest --watch, :3000) + web (vite, :5173).
# Vite proxies /api, /health and /metrics to the API inside the same container.
#
# Used as a Coolify custom service on the maintainer's dev server, and works with plain Docker Compose:
#   DATABASE_URL=postgres://... BETTER_AUTH_SECRET=... docker compose up
# Secrets (DATABASE_URL, BETTER_AUTH_SECRET, SEED_ADMIN_*) come from the environment, never from this file.
#
# MLLP is raw TCP and cannot go through an HTTP reverse proxy, so the range is published on MLLP_BIND_IP
# (use a LAN address). For production use docker-compose.prod.yml and the Dockerfile instead.
#
# File transport: FILE_SHARE is the host folder (e.g. a CIFS/NFS share) mounted as FILE_ROOT=/data/files;
# ORDER/RESULT/PROCESSED/ERROR are folders inside it. rslave lets a share mounted after start show up.
services:
  app:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    environment:
      - NODE_ENV=development
      - DATABASE_URL=${DATABASE_URL}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
      - PORT=3000
      - APP_URL=${APP_URL:-http://localhost:5173}
      # Public hostname when served behind a TLS proxy (enables Vite allowedHosts + HMR over wss)
      - PUBLIC_HOST=${PUBLIC_HOST:-}
      - API_PROXY_TARGET=http://localhost:3000
      - MLLP_PORT_RANGE=6100-6150
      - MLLP_ADVERTISED_HOST=${MLLP_BIND_IP:-127.0.0.1}
      - RETENTION_DEFAULT_DAYS=7
      - FILE_ROOT=/data/files
      - LOG_LEVEL=info
      - TURBO_TELEMETRY_DISABLED=1
      - NPM_CONFIG_UPDATE_NOTIFIER=false
    volumes:
      - ${ACKWELL_SRC:-.}:/app
      - ackwell-node-modules:/app/node_modules
      - ${FILE_SHARE:-./data/files}:/data/files:rslave
    expose:
      - "5173"
      - "3000"
    ports:
      - "${MLLP_BIND_IP:-127.0.0.1}:6100-6150:6100-6150"
    restart: unless-stopped

volumes:
  ackwell-node-modules:
