name: CI

on:
    push:
        branches: [main]
        tags: ['v*']
    pull_request:

permissions:
    contents: read

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
    check:
        name: Typecheck and test
        runs-on: ubuntu-latest
        env:
            TURBO_TELEMETRY_DISABLED: '1'
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version-file: .nvmrc
                  cache: npm
            - run: npm ci
            - run: npm run typecheck
            # The API e2e tests start Postgres with Testcontainers (Docker is available on the runner)
            # and bind MLLP listeners on ports 6010-6050.
            - run: npm test

    docker:
        name: Docker image
        runs-on: ubuntu-latest
        needs: check
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v4
            - uses: docker/setup-buildx-action@v3
            - uses: docker/metadata-action@v5
              id: meta
              with:
                  images: ghcr.io/${{ github.repository }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha
                      type=semver,pattern={{version}}
            # Pull requests only build the image; pushes to main and version tags publish it to GHCR.
            - if: github.event_name != 'pull_request'
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: ${{ github.event_name != 'pull_request' }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
